<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowiq Studio</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden select-none">
    
    <!-- Top Navbar -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 px-4 py-3 flex justify-between items-center z-20">
        <div class="flex items-center gap-2">
            <button id="btn-back" class="hidden text-slate-400 hover:text-white p-1 rounded-lg transition">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <h1 class="font-bold text-base text-indigo-400 flex items-center gap-2">
                <i data-lucide="cpu" class="w-5 h-5"></i> Flowiq Studio
            </h1>
        </div>
        <div class="flex items-center gap-2">
            <button id="btn-play" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shadow-lg shadow-emerald-600/20">
                <i data-lucide="play" class="w-4 h-4"></i> Testar
            </button>
            <button id="btn-save" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shadow-lg shadow-indigo-600/20">
                <i data-lucide="save" class="w-4 h-4"></i> Salvar
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        
        <!-- View 1: Project Hub -->
        <div id="view-hub" class="flex-1 flex flex-col p-4 overflow-y-auto space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <h2 class="text-lg font-bold text-slate-100 mb-1 flex items-center gap-2">
                    <i data-lucide="folder-kanban" class="text-indigo-400 w-5 h-5"></i> Meus Projetos OS
                </h2>
                <p class="text-xs text-slate-400 mb-4">Gerencie e crie seus sistemas operacionais e interfaces 2D.</p>
                <button id="btn-new-project" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] transition py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/25">
                    <i data-lucide="plus-circle" class="w-5 h-5"></i> Novo Projeto OS
                </button>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex-1 flex flex-col shadow-xl">
                <h3 class="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2">
                    <i data-lucide="archive" class="w-4 h-4 text-indigo-400"></i> Projetos Salvos no VFS
                </h3>
                <div id="hub-project-list" class="flex-1 overflow-y-auto space-y-2 pr-1">
                    <div class="text-center py-10 text-slate-500 text-xs">Carregando projetos...</div>
                </div>
            </div>
        </div>

        <!-- View 2: Studio Workspace -->
        <div id="view-workspace" class="flex-1 flex flex-col md:flex-row overflow-hidden hidden">
            <!-- Explorer Sidebar -->
            <aside class="w-full md:w-64 bg-slate-900/60 border-b md:border-b-0 md:border-r border-slate-800 flex flex-col h-1/3 md:h-full">
                <div class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-900">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i data-lucide="folder-tree" class="w-4 h-4 text-indigo-400"></i> Explorer
                    </span>
                    <div class="flex gap-1">
                        <button id="btn-add-frame" title="Adicionar Frame" class="p-1.5 hover:bg-slate-800 text-blue-400 rounded-lg transition">
                            <i data-lucide="square" class="w-4 h-4"></i>
                        </button>
                        <button id="btn-add-button" title="Adicionar Botão" class="p-1.5 hover:bg-slate-800 text-emerald-400 rounded-lg transition">
                            <i data-lucide="mouse-pointer-click" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
                <div id="explorer-tree" class="flex-1 overflow-y-auto p-2 text-sm space-y-0.5"></div>
            </aside>

            <!-- Viewport Canvas -->
            <section class="flex-1 bg-slate-950 relative flex items-center justify-center overflow-hidden p-4">
                <div id="viewport-canvas" class="w-full max-w-[380px] h-[640px] bg-slate-900/40 border border-slate-800 rounded-3xl relative overflow-hidden shadow-2xl flex items-center justify-center">
                    <span class="text-slate-600 text-xs flex items-center gap-1.5">
                        <i data-lucide="layout" class="w-4 h-4"></i> Palco 2D Vazio
                    </span>
                </div>
            </section>

            <!-- Properties Panel -->
            <aside class="w-full md:w-72 bg-slate-900/60 border-t md:border-t-0 md:border-l border-slate-800 flex flex-col h-1/3 md:h-full">
                <div class="p-3 border-b border-slate-800 bg-slate-900">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i data-lucide="sliders" class="w-4 h-4 text-indigo-400"></i> Inspetor
                    </span>
                </div>
                <div id="properties-content" class="flex-1 overflow-y-auto p-4 text-sm space-y-4">
                    <div class="text-slate-500 text-xs text-center py-10">Selecione um objeto para editar.</div>
                </div>
            </aside>
        </div>

    </main>

    <script type="module" src="./js/studio.js"></script>
</body>
</html>
