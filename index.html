<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flowiq Studio v1.0</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #030712; color: #f3f4f6; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
        .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; height: 100%; position: absolute; width: 100%; top: 0; left: 0; background: #030712; }
        .screen.active { display: flex; z-index: 10; }
        .studio-drawer { position: absolute; bottom: 0; left: 0; width: 100%; max-height: 65%; background: #111827; border-top: 1px solid #1f2937; border-radius: 20px 20px 0 0; display: none; flex-direction: column; z-index: 50; box-shadow: 0 -10px 30px rgba(0,0,0,0.8); }
        .studio-drawer.open { display: flex; }
    </style>
</head>
<body class="select-none">

    <!-- Top Navbar -->
    <header class="bg-gray-900 border-b border-gray-800 px-4 py-3 flex justify-between items-center z-40 flex-shrink-0 h-14">
        <div class="flex items-center gap-2">
            <button id="btn-back" onclick="app.returnToHub()" class="hidden text-gray-400 hover:text-white p-1 rounded-lg transition">
                <span id="ico-back"></span>
            </button>
            <h1 class="font-bold text-sm text-indigo-400 flex items-center gap-2">
                <span id="ico-cpu"></span> Flowiq Studio <span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-1.5 py-0.5 rounded">v1.0</span>
            </h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="app.toggleFullScreen()" class="bg-gray-800 border border-gray-700 text-gray-300 px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                <span id="ico-max"></span> Tela Cheia
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 relative overflow-hidden flex flex-col">

        <!-- VIEW 1: HUB DE PROJETOS -->
        <div id="view-hub" class="screen active p-4 overflow-y-auto space-y-4">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
                <h2 class="text-base font-bold text-gray-100 mb-1 flex items-center gap-2">
                    <span id="ico-kanban" class="text-indigo-400"></span> Meus Sistemas OS
                </h2>
                <p class="text-xs text-gray-400 mb-4">Gerencie e construa suas interfaces e sistemas 2D.</p>
                <button onclick="app.createNewProject()" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] transition py-3 rounded-xl font-semibold text-xs flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/25 text-white">
                    <span id="ico-plus"></span> Novo Projeto OS
                </button>
            </div>

            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 flex-1 flex flex-col shadow-xl min-h-[250px]">
                <h3 class="text-xs font-bold text-gray-300 mb-3 flex items-center gap-2 uppercase tracking-wider">
                    <span id="ico-archive" class="text-indigo-400"></span> Projetos Salvos
                </h3>
                <div id="hub-project-list" class="flex-1 overflow-y-auto space-y-2.5 pr-1">
                    <div class="text-center py-12 text-gray-500 text-xs">Carregando projetos...</div>
                </div>
            </div>
        </div>

        <!-- VIEW 2: WORKSPACE DO ESTÚDIO -->
        <div id="view-workspace" class="screen flex flex-col">
            <!-- Viewport Canvas Central -->
            <section class="flex-1 bg-gray-950 relative flex items-center justify-center p-4 overflow-hidden" onclick="app.clearSelection(event)">
                <div id="viewport-canvas" class="w-full max-w-[320px] h-full max-h-[540px] bg-gray-900/40 border border-gray-800 rounded-3xl relative overflow-hidden shadow-2xl"></div>
            </section>

            <!-- GAVETA: EXPLORER -->
            <div id="drawer-explorer" class="studio-drawer p-4 space-y-3">
                <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                    <span class="text-xs font-bold text-gray-300 uppercase tracking-wider flex items-center gap-1.5">
                        <span id="ico-tree" class="text-indigo-400"></span> Explorer (Hierarquia)
                    </span>
                    <button onclick="app.toggleDrawer(null)" class="text-gray-400 hover:text-white p-1">
                        <span id="ico-close-1"></span>
                    </button>
                </div>
                <div class="flex gap-2">
                    <button onclick="app.addInstance('Frame')" class="flex-1 bg-indigo-600/20 border border-indigo-500/30 text-indigo-300 hover:bg-indigo-600 hover:text-white py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition">
                        <span id="ico-square"></span> + Frame
                    </button>
                    <button onclick="app.addInstance('TextButton')" class="flex-1 bg-emerald-600/20 border border-emerald-500/30 text-emerald-300 hover:bg-emerald-600 hover:text-white py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition">
                        <span id="ico-mouse"></span> + Botão
                    </button>
                </div>
                <div id="explorer-tree" class="flex-1 overflow-y-auto space-y-1.5 max-h-[220px] pr-1"></div>
            </div>

            <!-- GAVETA: PROPRIEDADES / INSPETOR -->
            <div id="drawer-properties" class="studio-drawer p-4 space-y-3">
                <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                    <span class="text-xs font-bold text-gray-300 uppercase tracking-wider flex items-center gap-1.5">
                        <span id="ico-sliders" class="text-indigo-400"></span> Inspetor de Propriedades
                    </span>
                    <button onclick="app.toggleDrawer(null)" class="text-gray-400 hover:text-white p-1">
                        <span id="ico-close-2"></span>
                    </button>
                </div>
                <div id="properties-content" class="flex-1 overflow-y-auto space-y-3 max-h-[260px] pr-1 text-xs">
                    <div class="text-gray-500 text-center py-10">Selecione um objeto para editar.</div>
                </div>
            </div>

            <!-- Navegação Inferior (Dock Mobile) -->
            <nav class="bg-gray-900 border-t border-gray-800 px-4 py-2 flex justify-around items-center flex-shrink-0 h-16 z-30">
                <button onclick="app.toggleDrawer('drawer-explorer')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-indigo-400 transition">
                    <span id="ico-nav-tree"></span>
                    <span class="text-[10px] font-medium">Explorer</span>
                </button>
                <button onclick="app.toggleDrawer('drawer-properties')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-indigo-400 transition">
                    <span id="ico-nav-sliders"></span>
                    <span class="text-[10px] font-medium">Inspetor</span>
                </button>
                <button onclick="app.runPlayMode()" class="flex flex-col items-center gap-1 text-emerald-400 hover:text-emerald-300 transition">
                    <span id="ico-nav-play"></span>
                    <span class="text-[10px] font-medium">Play OS</span>
                </button>
                <button onclick="app.returnToHub()" class="flex flex-col items-center gap-1 text-rose-400 hover:text-rose-300 transition">
                    <span id="ico-nav-out"></span>
                    <span class="text-[10px] font-medium">Sair</span>
                </button>
            </nav>
        </div>

    </main>

    <!-- Studio Core Engine Script com Motor de Ícones Nativo SVG -->
    <script>
        // Motor de Ícones Nativos SVG (Zero dependência externa, 100% seguro contra falhas de rede)
        const Icons = {
            cpu: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></svg>',
            folder: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
            folderOpen: '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
            plus: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>',
            trash: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
            square: '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>',
            mouse: '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>',
            sliders: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>',
            play: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
            x: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
            arrowLeft: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>',
            maximize: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>',
            monitor: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>',
            layout: '<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>',
            kanban: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><line x1="9" y1="10" x2="9" y2="16"/><line x1="15" y1="10" x2="15" y2="14"/></svg>',
            archive: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>',
            logout: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
            folderOpenState: '<svg class="w-8 h-8 opacity-40" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>'
        };

        class StudioApp {
            constructor() {
                this.currentProj = null;
                this.selectedId = null;
                this.init();
            }

            init() {
                this.injectStaticIcons();
                this.loadHubProjects();
                this.checkActiveSession();
            }

            injectStaticIcons() {
                document.getElementById('ico-back').innerHTML = Icons.arrowLeft;
                document.getElementById('ico-cpu').innerHTML = Icons.cpu;
                document.getElementById('ico-max').innerHTML = Icons.maximize;
                document.getElementById('ico-kanban').innerHTML = Icons.kanban;
                document.getElementById('ico-plus').innerHTML = Icons.plus;
                document.getElementById('ico-archive').innerHTML = Icons.archive;
                document.getElementById('ico-tree').innerHTML = Icons.sliders; // ou tree
                document.getElementById('ico-close-1').innerHTML = Icons.x;
                document.getElementById('ico-close-2').innerHTML = Icons.x;
                document.getElementById('ico-square').innerHTML = Icons.square;
                document.getElementById('ico-mouse').innerHTML = Icons.mouse;
                document.getElementById('ico-sliders').innerHTML = Icons.sliders;
                
                // Dock inferior
                document.getElementById('ico-nav-tree').innerHTML = Icons.sliders;
                document.getElementById('ico-nav-sliders').innerHTML = Icons.sliders;
                document.getElementById('ico-nav-play').innerHTML = Icons.play;
                document.getElementById('ico-nav-out').innerHTML = Icons.logout;
            }

            checkActiveSession() {
                const activeId = localStorage.getItem('flowiq_active_id');
                if (activeId) {
                    const projects = this.getAllProjects();
                    const found = projects.find(p => p.id == activeId);
                    if (found) this.openProject(found.id, false);
                }
            }

            getAllProjects() {
                try {
                    return JSON.parse(localStorage.getItem('flowiq_projects') || '[]');
                } catch (e) {
                    return [];
                }
            }

            saveAllProjects(projects) {
                localStorage.setItem('flowiq_projects', JSON.stringify(projects));
            }

            toggleFullScreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }

            loadHubProjects() {
                const container = document.getElementById('hub-project-list');
                const projects = this.getAllProjects();

                if (projects.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-12 text-gray-500 text-xs flex flex-col items-center gap-2">
                            ${Icons.folderOpenState}
                            Nenhum projeto encontrado. Crie o primeiro acima!
                        </div>
                    `;
                    return;
                }

                container.innerHTML = projects.map(p => `
                    <div class="bg-gray-950/60 border border-gray-800 hover:border-indigo-500/50 p-3.5 rounded-xl flex justify-between items-center transition">
                        <div class="flex items-center gap-3 truncate">
                            <div class="p-2 rounded-lg bg-indigo-500/10 text-indigo-400 flex-shrink-0">
                                ${Icons.cpu}
                            </div>
                            <div class="truncate">
                                <h4 class="font-semibold text-xs text-gray-200 truncate">${p.name}</h4>
                                <span class="text-[10px] text-gray-500">Atualizado: ${p.updated || 'Hoje'}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5 flex-shrink-0">
                            <button onclick="app.openProject(${p.id}, true)" class="bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1">
                                ${Icons.folderOpen} Abrir
                            </button>
                            <button onclick="app.deleteProject(${p.id}, event)" class="text-gray-500 hover:text-rose-400 p-1.5 rounded-lg transition" title="Excluir">
                                ${Icons.trash}
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            createNewProject() {
                const name = prompt("Nome do seu Sistema Operacional (ex: NeoOS):", "NeoOS");
                if (!name) return;

                const newProj = {
                    id: Date.now(),
                    name: name,
                    updated: new Date().toLocaleDateString(),
                    instances: [
                        { id: Date.now() + 1, name: "JanelaPrincipal", type: "Frame", bg: "#1e293b", width: 200, height: 130, x: 30, y: 40, text: "" },
                        { id: Date.now() + 2, name: "BotaoAcao", type: "TextButton", bg: "#6366f1", width: 140, height: 45, x: 60, y: 190, text: "Clique Aqui" }
                    ]
                };

                const projects = this.getAllProjects();
                projects.push(newProj);
                this.saveAllProjects(projects);
                this.openProject(newProj.id, true);
            }

            deleteProject(id, event) {
                event.stopPropagation();
                if (!confirm("Deseja excluir este projeto permanentemente?")) return;
                let projects = this.getAllProjects();
                projects = projects.filter(p => p.id !== id);
                this.saveAllProjects(projects);
                this.loadHubProjects();
            }

            openProject(id, changeScreen = true) {
                const projects = this.getAllProjects();
                this.currentProj = projects.find(p => p.id == id);
                if (!this.currentProj) return;

                localStorage.setItem('flowiq_active_id', this.currentProj.id);
                
                if (changeScreen) {
                    document.getElementById('view-hub').classList.remove('active');
                    document.getElementById('view-workspace').classList.add('active');
                    document.getElementById('btn-back').classList.remove('hidden');
                }

                this.selectedId = null;
                this.toggleDrawer(null);
