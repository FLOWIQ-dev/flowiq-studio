
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#090e18">
  <meta name="description"
    content="Flowiq Studio: editor mobile-first para criação de interfaces e sistemas 2D.">

  <title>Flowiq Studio</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">

  <style>
    :root {
      color-scheme: dark;

      --bg: #090e18;
      --surface: #101827;
      --surface-2: #151f30;
      --surface-3: #1c293d;
      --border: #28364c;
      --text: #edf3ff;
      --muted: #8796ad;
      --primary: #4d8dff;
      --primary-hover: #3478ed;
      --danger: #ef5264;
      --success: #39c995;

      --topbar: 58px;
      --dock: 66px;
      --panel-width: 245px;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
    }

    .screen.active {
      display: flex;
    }

    .muted {
      color: var(--muted);
    }

    .divider {
      height: 1px;
      border: 0;
      background: var(--border);
      margin: 16px 0;
    }

    /* BOTÕES */

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-3);
      color: var(--text);
      font-size: 12px;
      font-weight: 650;
      transition: background .15s, border-color .15s;
    }

    .btn:hover {
      background: #263650;
      border-color: #405574;
    }

    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .btn.primary:hover {
      background: var(--primary-hover);
    }

    .btn.danger {
      color: #ff8a97;
      border-color: #63313c;
      background: #321c27;
    }

    .btn.icon-btn {
      width: 38px;
      min-width: 38px;
      padding: 0;
      font-size: 17px;
    }

    /* HUB */

    #hub {
      flex-direction: column;
      overflow-y: auto;
      background:
        radial-gradient(ellipse at 50% -20%, #1d3760 0%, transparent 55%),
        var(--bg);
    }

    .hub-header {
      width: 100%;
      min-height: 70px;
      padding: 15px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: #0c1422cc;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 17px;
      font-weight: 850;
      letter-spacing: -.5px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: linear-gradient(145deg, #559aff, #3159c9);
      color: white;
      font-size: 19px;
      box-shadow: 0 5px 20px #2868d455;
    }

    .hub-main {
      width: min(100%, 1050px);
      margin: 0 auto;
      padding: 42px 24px 60px;
    }

    .hub-intro {
      margin-bottom: 32px;
    }

    .hub-intro h1 {
      margin: 0 0 10px;
      font-size: clamp(27px, 5vw, 42px);
      letter-spacing: -1.5px;
    }

    .hub-intro p {
      max-width: 520px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .hub-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .hub-toolbar h2 {
      margin: 0;
      font-size: 16px;
    }

    #project-count {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    #project-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }

    .project-card {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(145deg, #172337, #101827);
    }

    .project-card h3 {
      overflow-wrap: anywhere;
      margin: 0 0 10px;
      font-size: 15px;
    }

    .project-card p {
      color: var(--muted);
      font-size: 11px;
      margin: 0 0 18px;
    }

    .project-actions {
      display: flex;
      gap: 8px;
    }

    .project-actions .primary {
      flex: 1;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 35px 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 14px;
      line-height: 1.8;
      font-size: 13px;
    }

    /* BARRA SUPERIOR DO EDITOR */

    #workspace {
      flex-direction: column;
      position: relative;
      min-width: 0;
      overflow: hidden;
    }

    .topbar {
      height: var(--topbar);
      min-height: var(--topbar);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 850;
      white-space: nowrap;
    }

    .topbar-brand .brand-icon {
      width: 29px;
      height: 29px;
      border-radius: 8px;
      font-size: 15px;
    }

    .breadcrumb {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #project-title {
      color: var(--text);
      font-weight: 700;
    }

    .topbar-spacer {
      flex: 1;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .topbar-actions .btn {
      min-height: 34px;
      padding: 6px 10px;
    }

    /* ÁREA PRINCIPAL */

    .editor-layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: var(--panel-width) minmax(0, 1fr) var(--panel-width);
      overflow: hidden;
    }

    /* EXPLORER E INSPECTOR */

    .side-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--surface);
      overflow: hidden;
      z-index: 20;
    }

    .explorer {
      border-right: 1px solid var(--border);
    }

    .inspector {
      border-left: 1px solid var(--border);
    }

    .panel-header {
      height: 47px;
      min-height: 47px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 13px;
      border-bottom: 1px solid var(--border);
    }

    .panel-header h2 {
      margin: 0;
      font-size: 11px;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .panel-header button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 19px;
    }

    .panel-content {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 10px;
    }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding-top: 5px;
      padding-bottom: 5px;
      border-radius: 7px;
      color: #c4d0e2;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
    }

    .tree-row:hover {
      background: var(--surface-3);
    }

    .tree-row.selected {
      background: #244777;
      color: white;
    }

    .tree-row .node-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* INSPECTOR */

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      margin-bottom: 13px;
    }

    .field label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      min-width: 0;
      min-height: 36px;
      padding: 8px 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #0b1320;
      color: var(--text);
      font-size: 12px;
    }

    .field textarea {
      resize: vertical;
      min-height: 58px;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--primary);
    }

    .field input:disabled {
      color: var(--muted);
      opacity: .7;
    }

    .field input[type="color"] {
      height: 39px;
      padding: 3px;
      cursor: pointer;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    /* PALCO */

    .stage-area {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0b1220;
    }

    .stage-toolbar {
      height: 43px;
      min-height: 43px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: #101a2a;
      border-bottom: 1px solid var(--border);
    }

    .stage-toolbar strong {
      font-size: 11px;
    }

    .stage-toolbar span {
      color: var(--muted);
      font-size: 10px;
    }

    .stage-toolbar .spacer {
      flex: 1;
    }

    .stage-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 22px;
      overscroll-behavior: contain;
      background-image:
        linear-gradient(#ffffff08 1px, transparent 1px),
        linear-gradient(90deg, #ffffff08 1px, transparent 1px);
      background-size: 22px 22px;
    }

    #stage-wrap {
      width: 100%;
      min-height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    #canvas {
      position: relative;
      width: min(100%, 900px);
      min-width: 300px;
      height: 620px;
      flex: 0 0 auto;
      overflow: hidden;
      border: 1px solid #40516b;
      border-radius: 12px;
      background-color: #111c2d;
      background-image:
        linear-gradient(#ffffff09 1px, transparent 1px),
        linear-gradient(90deg, #ffffff09 1px, transparent 1px);
      background-size: 20px 20px;
      box-shadow: 0 15px 50px #0005;
      touch-action: pan-x pan-y;
    }

    .node {
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .node:active {
      cursor: grabbing;
    }

    .node.selected {
      outline: 2px solid #60a5fa !important;
      outline-offset: 2px;
    }

    .button-node {
      cursor: pointer;
    }

    .empty-canvas {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
      pointer-events: none;
    }

    /* CONSOLE */

    .console {
      height: 112px;
      min-height: 112px;
      display: flex;
      flex-direction: column;
      background: #0a111d;
      border-top: 1px solid var(--border);
    }

    .console-header {
      height: 31px;
      min-height: 31px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid #202c40;
    }

    .console-header strong {
      color: #aebbd0;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .console-header button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
    }

    #console-log {
      flex: 1;
      overflow: auto;
      padding: 7px 12px;
      color: #a9bad0;
      font-family: ui-monospace, monospace;
      font-size: 10px;
      line-height: 1.7;
    }

    .log-error {
      color: #ff7585;
    }

    .log-ok {
      color: #55d8a8;
    }

    /* NAVEGAÇÃO MOBILE */

    .mobile-nav {
      display: none;
    }

    .drawer-backdrop {
      display: none;
    }

    /* MODAL */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: #030711c9;
      backdrop-filter: blur(7px);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: min(100%, 520px);
      max-height: min(85dvh, 750px);
      overflow: auto;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #111c2d;
      box-shadow: 0 25px 90px #0009;
    }

    .modal-box h2 {
      margin: 0 0 17px;
      font-size: 18px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .play-frame {
      position: relative;
      width: min(100%, 420px);
      min-width: 300px;
      height: 600px;
      overflow: hidden;
      border: 1px solid #42516b;
      border-radius: 12px;
      background: #111c2d;
    }

    /* TABLETS E CELULARES */

    @media (max-width: 760px) {
      :root {
        --topbar: 54px;
        --dock: 66px;
      }

      .topbar {
        padding: 0 9px;
        gap: 7px;
      }

      .topbar-brand {
        font-size: 12px;
      }

      .topbar-brand .brand-icon {
        width: 27px;
        height: 27px;
      }

      .breadcrumb {
        display: none;
      }

      .topbar-actions {
        gap: 5px;
      }

      .topbar-actions .btn {
        min-height: 32px;
        padding: 5px 8px;
        font-size: 11px;
      }

      .editor-layout {
        display: block;
        position: relative;
        overflow: hidden;
      }

      .stage-area {
        position: absolute;
        inset: 0;
        padding-bottom: calc(var(--dock) + env(safe-area-inset-bottom));
      }

      .stage-toolbar {
        height: 39px;
        min-height: 39px;
      }

      .stage-scroll {
        padding: 12px;
      }

      #canvas {
        width: 100%;
        min-width: 300px;
        height: 570px;
      }

      .console {
        height: 88px;
        min-height: 88px;
      }

      .side-panel {
        position: absolute;
        top: 0;
        bottom: calc(var(--dock) + env(safe-area-inset-bottom));
        width: min(86vw, 310px);
        max-width: 310px;
        z-index: 35;
        box-shadow: 0 10px 35px #0008;
        transition: transform .22s ease;
      }

      .explorer {
        left: 0;
        border-right: 1px solid var(--border);
        transform: translateX(-105%);
      }

      .inspector {
        right: 0;
        border-left: 1px solid var(--border);
        transform: translateX(105%);
      }

      .explorer.mobile-open,
      .inspector.mobile-open {
        transform: translateX(0);
      }

      .drawer-backdrop {
        position: absolute;
        inset: 0;
        bottom: calc(var(--dock) + env(safe-area-inset-bottom));
        z-index: 30;
        background: #02061188;
      }

      .drawer-backdrop.show {
        display: block;
      }

      .mobile-nav {
        position: absolute;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        left: 0;
        right: 0;
        bottom: 0;
        height: calc(var(--dock) + env(safe-area-inset-bottom));
        padding: 5px 7px env(safe-area-inset-bottom);
        background: #101a2a;
        border-top: 1px solid var(--border);
        z-index: 45;
      }

      .mobile-nav button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        min-width: 0;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        font-size: 10px;
        font-weight: 650;
      }

      .mobile-nav button .nav-icon {
        font-size: 20px;
        line-height: 1;
      }

      .mobile-nav button.active {
        background: #1b3456;
        color: #8ebaff;
      }

      .hub-header {
        padding: 12px 15px;
      }

      .hub-main {
        padding: 30px 16px 45px;
      }

      .hub-intro h1 {
        font-size: 29px;
      }

      #project-list {
        grid-template-columns: 1fr;
      }

      .modal-backdrop {
        align-items: flex-end;
        padding: 0;
      }

      .modal-box {
        width: 100%;
        max-height: 90dvh;
        padding: 19px 16px calc(18px + env(safe-area-inset-bottom));
        border-radius: 18px 18px 0 0;
      }

      .play-frame {
        height: min(65dvh, 600px);
      }
    }

    @media (max-width: 390px) {
      .topbar-brand span:last-child {
        display: none;
      }

      .topbar-actions .btn {
        padding: 5px 7px;
        font-size: 10px;
      }

      .stage-toolbar span {
        display: none;
      }
    }

    @media (min-width: 761px) {
      .side-panel {
        transform: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- HUB DE PROJETOS -->

  <main id="hub" class="screen active">

    <header class="hub-header">
      <div class="brand">
        <div class="brand-icon">F</div>
        <span>Flowiq Studio</span>
      </div>

      <button class="btn primary" id="btn-new">
        + Novo projeto
      </button>
    </header>

    <section class="hub-main">

      <div class="hub-intro">
        <h1>Crie. Edite. Construa.</h1>

        <p>
          Seu espaço de criação de interfaces e experiências 2D.
          Comece um projeto ou continue de onde parou.
        </p>
      </div>

      <div class="hub-toolbar">
        <div>
          <h2>Meus projetos</h2>
          <div id="project-count">0 projetos</div>
        </div>

        <button class="btn" id="btn-import">
          ↑ Importar
        </button>

        <input
          type="file"
          id="file-input"
          accept=".flowiq,.json,application/json"
          hidden
        >
      </div>

      <div id="project-list">
        <div class="empty">
          Carregando projetos...
        </div>
      </div>

    </section>
  </main>


  <!-- EDITOR -->

  <main id="workspace" class="screen">

    <!-- TOPBAR -->

    <header class="topbar">

      <div class="topbar-brand">
        <div class="brand-icon">F</div>
        <span>Flowiq</span>
      </div>

      <div class="breadcrumb" id="breadcrumb">
        / Projetos
      </div>

      <div class="topbar-spacer"></div>

      <div class="topbar-actions">

        <button class="btn" id="btn-hub" title="Voltar aos projetos">
          ← <span>Projetos</span>
        </button>

        <button class="btn" id="btn-export" disabled>
          ↓ <span>Exportar</span>
        </button>

        <button class="btn primary" id="btn-save" disabled>
          ✓ <span>Salvar</span>
        </button>

      </div>
    </header>


    <!-- LAYOUT DO EDITOR -->

    <section class="editor-layout">

      <!-- EXPLORER -->

      <aside class="side-panel explorer" id="explorer">

        <div class="panel-header">
          <h2>Explorer</h2>

          <button data-close-panel aria-label="Fechar Explorer">
            ×
          </button>
        </div>

        <div class="panel-content">

          <div style="
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:8px;
            margin-bottom:12px
          ">
            <span class="muted" style="
              font-size:10px;
              font-weight:700;
              letter-spacing:.5px
            ">
              HIERARQUIA
            </span>
