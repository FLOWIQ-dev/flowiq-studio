<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flowiq Studio - Professional 2D UI Engine</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-base: #0f1117;
            --bg-surface: #161922;
            --bg-card: #1e222e;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --success: #10b981;
            --radius-lg: 14px;
            --radius-md: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100dvh;
            display: flex; flex-direction: column; 
            overflow: hidden; 
        }

        header { 
            background: var(--bg-surface); 
            border-bottom: 1px solid var(--border-subtle); 
            padding: 10px 16px; 
            display: flex; justify-content: space-between; align-items: center; 
            height: 50px; flex-shrink: 0; z-index: 10;
        }

        h1 { font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }

        .btn { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: var(--radius-md); font-weight: 500; font-size: 0.85rem; cursor: pointer; text-align: center; }
        .btn:active { background: var(--accent-hover); }
        .btn-secondary { background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-main); }

        .main-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; height: 100%; }
        .screen.active { display: flex; }

        .hub-screen { padding: 16px; gap: 16px; overflow-y: auto; }
        .card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 16px; }

        /* Workspace do Studio */
        .workspace-header { background: var(--bg-surface); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-subtle); height: 45px; flex-shrink: 0; }
        
        .workspace-body { flex: 1; position: relative; background: #0a0c10; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 10px; }

        .phone-viewport { 
            width: 100%; max-width: 280px; height: 100%; max-height: 440px; 
            background: #000; border: 2px solid #2a3142; border-radius: 24px; 
            position: relative; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
        }

        .ui-element { position: absolute; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: white; box-sizing: border-box; }

        /* Barra Inferior Fixa */
        .studio-nav { 
            background: var(--bg-surface); border-top: 1px solid var(--border-subtle); 
            display: flex; justify-content: space-around; align-items: center; 
            height: 60px; flex-shrink: 0; z-index: 100; 
        }
        .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 0.7rem; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; padding: 6px 16px; }
        .nav-btn.active { color: var(--accent); }

        /* Gavetas Deslizantes */
        .studio-drawer { 
            position: absolute; bottom: 0; left: 0; width: 100%; max-height: 60%; 
            background: var(--bg-surface); border-top: 1px solid var(--border-subtle); 
            border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 16px; 
            display: none; flex-direction: column; gap: 10px; z-index: 200; overflow-y: auto; 
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8); 
        }
        .studio-drawer.open { display: flex; }

        .tree-item { padding: 8px 12px; background: var(--bg-card); border-radius: 6px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; border: 1px solid var(--border-subtle); cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>⚡ Flowiq <span style="font-size: 0.65rem; color: var(--text-muted); background: var(--bg-card); padding: 2px 6px; border-radius: 10px;">Studio v1.0</span></h1>
        <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();">⛶ Tela Cheia</button>
    </header>

    <div class="main-container">
        <!-- HUB DE PROJETOS -->
        <div id="hubScreen" class="screen active hub-screen">
            <div class="card">
                <h2 style="font-size: 0.95rem; margin-bottom: 4px;">Gerenciador de Experiências 2D</h2>
                <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px;">Crie sistemas operacionais e UIs avançadas isoladas.</p>
                <button class="btn" id="newProjectBtn" style="width: 100%;">+ Novo Projeto OS</button>
            </div>
            <div class="card" style="flex: 1; display: flex; flex-direction: column;">
                <h3 style="font-size: 0.85rem; margin-bottom: 8px;">Projetos Salvos</h3>
                <div id="projectList" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                    <p style="color: var(--text-muted); font-size: 0.8rem; text-align: center; padding: 20px;">Nenhum projeto criado.</p>
                </div>
            </div>
        </div>

        <!-- WORKSPACE DO ESTÚDIO -->
        <div id="workspaceScreen" class="screen">
            <div class="workspace-header">
                <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" id="backHubBtn">← Voltar</button>
                <span id="currentProjectTitle" style="font-weight: 600; font-size: 0.85rem;">Projeto</span>
                <button class="btn" style="padding: 4px 10px; font-size: 0.75rem; background: var(--success);" onclick="alert('Modo Play: Experiência compilada e rodando no Sandbox!')">▶ Play</button>
            </div>

            <div class="workspace-body">
                <div class="phone-viewport" id="viewportCanvas"></div>

                <!-- GAVETA EXPLORER -->
                <div id="explorerDrawer" class="studio-drawer">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-subtle); padding-bottom: 6px;">
                        <strong style="font-size: 0.85rem;">Explorer (DataModel)</strong>
                        <button onclick="window.FlowiqStudio.closeDrawers()" style="background:none; border:none; color:var(--text-muted); font-size:1.1rem; cursor:pointer;">✕</button>
                    </div>
                    <button class="btn" style="font-size: 0.8rem; padding: 8px;" id="addFrameBtn">+ Adicionar Frame</button>
                    <button class="btn" style="font-size: 0.8rem; padding: 8px; background: var(--bg-card); border: 1px solid var(--border-subtle);" id="addButtonBtn">+ Adicionar Botão</button>
                    <div id="instanceTree" style="background: var(--bg-card); padding: 8px; border-radius: var(--radius-md); max-height: 140px; overflow-y: auto; border: 1px solid var(--border-subtle);"></div>
                </div>

                <!-- GAVETA PROPRIEDADES -->
                <div id="propertiesDrawer" class="studio-drawer">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-subtle); padding-bottom: 6px;">
                        <strong style="font-size: 0.85rem;">Propriedades (Inspector)</strong>
                        <button onclick="window.FlowiqStudio.closeDrawers()" style="background:none; border:none; color:var(--text-muted); font-size:1.1rem; cursor:pointer;">✕</button>
                    </div>
                    <div id="propDetails" style="font-size: 0.8rem; color: var(--text-muted);">Selecione um nó na árvore.</div>
                </div>
            </div>

            <!-- BARRA INFERIOR -->
            <div class="studio-nav">
                <button class="nav-btn" onclick="window.FlowiqStudio.toggleDrawer('explorerDrawer')">
                    <span style="font-size: 1.1rem;">📂</span><span>Explorer</span>
                </button>
                <button class="nav-btn" onclick="window.FlowiqStudio.toggleDrawer('propertiesDrawer')">
                    <span style="font-size: 1.1rem;">⚙️</span><span>Propriedades</span>
                </button>
                <button class="nav-btn" onclick="alert('Editor de Scripts em breve.')">
                    <span style="font-size: 1.1rem;">💻</span><span>Scripts</span>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="./js/studio.js"></script>
</body>
    </html>
